function controlHTML(c){
  if(c.type==='select')return `<label class="ctl"><span>${c.label}</span><select data-id="${c.id}">${c.options.map(o=>`<option value="${o[0]}"${String(o[0])===String(c.value)?' selected':''}>${o[1]}</option>`).join('')}</select></label>`;
  if(c.type==='check')return `<label class="chk"><input type="checkbox" data-id="${c.id}"${c.value?' checked':''}> ${c.label}</label>`;
  if(c.type==='log')return `<div class="ctl"><div class="ctl-h"><span>${c.label}</span><output data-out="${c.id}">${c.fmt(c.toVal(c.value))}</output></div><input type="range" data-id="${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}"></div>`;
  return `<div class="ctl"><div class="ctl-h"><span>${c.label}</span><input type="number" class="num" data-num="${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}"></div><input type="range" data-id="${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}"></div>`;
}
function pageSim(m){
  const S=m.init(),P={},allC=m.controles.flatMap(g=>g.items),byId=Object.fromEntries(allC.map(c=>[c.id,c]));
  allC.forEach(c=>{P[c.id]=c.type==='log'?c.toVal(c.value):c.type==='select'&&c.num?+c.value:c.value});
  const dec=s=>(String(s).split('.')[1]||'').length;
  const read=(c,el)=>c.type==='range'?+el.value:c.type==='log'?c.toVal(+el.value):c.type==='select'?(c.num?+el.value:el.value):el.checked;
  const sync=c=>{const el=$(`[data-id="${c.id}"]`);if(!el)return;if(c.type==='range'){const n=$(`[data-num="${c.id}"]`);if(n&&document.activeElement!==n)n.value=(+el.value).toFixed(dec(c.step))}if(c.type==='log'){const o=$(`[data-out="${c.id}"]`);if(o)o.textContent=c.fmt(P[c.id])}};
  const ctx={P,S,render,set(id,val){const c=byId[id],el=$(`[data-id="${id}"]`);if(c.type==='check')el.checked=!!val;else el.value=val;P[id]=read(c,el);sync(c)}};
  function render(){
    try{
      const out=m.calcular(P,ctx);
      if(out.extra!==undefined)$('#extra').innerHTML=out.extra;
      out.figs.forEach((fg,i)=>plot('fig'+i,fg.data,fg.layout));
      $('#panel-res').innerHTML=out.panel;renderTex($('#panel-res'));
    }catch(e){console.error(e);$('#panel-res').innerHTML=`<div class="msg bad">Error al calcular: ${esc(e.message)}</div>`}
  }
  view.innerHTML=`<div class="crumbs"><a href="#/">Inicio</a> › <a href="#/modulos">Módulos</a> › ${m.titulo}</div>
  <div class="titlerow"><div><span class="badge">${m.oculto?'Desafío':'Módulo '+m.num} · ${m.cap}</span><h1>${m.titulo}</h1></div><div class="acts"><button class="btn" id="btn-tutorial">Tutorial</button><button class="btn primary" id="btn-teoria">📘 Teoría</button></div></div>
  <p class="lead">${m.resumen}</p>
  ${nachito(TIPS[m.id])}
  ${m.video?`<details class="card vid" open><summary>🎬 Video: del piso a la probabilidad</summary><div class="vidwrap"><video controls preload="metadata" playsinline src="${m.video.src}" aria-label="${m.video.alt}"></video><p class="muted">${m.video.nota}</p></div></details>`:''}
  <details class="card" open><summary>Planteamiento</summary>${m.plan}</details>
  <div class="sim"><section class="card ctrl" id="panel-ctrl"><h3>Controles</h3>${m.controles.map(g=>`<div class="grp">${g.grupo}</div>${g.items.map(controlHTML).join('')}`).join('')}<div class="btns">${(m.botones||[]).map((b,i)=>`<button class="btn ${b.cls||''}" data-btn="${i}">${b.label}</button>`).join('')}</div></section>
  <section><div id="extra"></div><div id="figs" class="figs">${m.figs.map((g,i)=>`<div class="card fig${g.wide?' wide':''}"><div class="fighead"><span>Figura ${i+1}</span><button class="btn sm" data-info="${i}" title="Interpretación académica de esta gráfica" aria-label="Interpretación de la figura ${i+1}">ⓘ Interpretación</button></div><div id="fig${i}" style="height:${g.h}px"></div></div>`).join('')}</div><div class="card res" id="panel-res"></div></section></div>${m.oculto?'':`<p style="margin-top:18px">${nextLink(m)}</p>`}${footer}`;
  renderTex($('details'));
  const ctrl=$('#panel-ctrl');
  ctrl.addEventListener('input',e=>{
    const t=e.target;let c,el;
    if(t.dataset.num){c=byId[t.dataset.num];if(t.value===''||isNaN(+t.value))return;el=$(`[data-id="${c.id}"]`);el.value=clamp(+t.value,+c.min,+c.max)}
    else if(t.dataset.id){c=byId[t.dataset.id];el=t}else return;
    P[c.id]=read(c,el);sync(c);render();
  });
  ctrl.addEventListener('click',e=>{const b=e.target.closest('[data-btn]');if(!b)return;const r=m.botones[+b.dataset.btn].fn(ctx);if(r!==false)render()});
  $('#btn-teoria').onclick=()=>openModal('Teoría · '+m.titulo,m.teoria);
  $('#btn-tutorial').onclick=()=>startTutorial(0);
  view.onclick=e=>{const pb=e.target.closest('[data-play]');if(pb){playPulse(pb.closest('.svgbox'),+pb.dataset.play);return}const b=e.target.closest('[data-info]');if(!b)return;const it=(INFO[m.id]||{})[b.dataset.info];if(it)openModal('Interpretación · '+it.t,it.h)};
  CUR={m,S,P};
  render();
}
const nextLink=m=>{const i=VIS.indexOf(m);return `${i>0?`<a class="btn" href="#/m/${VIS[i-1].id}">← ${VIS[i-1].num}. Anterior</a> `:''}${i<VIS.length-1?`<a class="btn primary" href="#/m/${VIS[i+1].id}">Siguiente módulo: ${VIS[i+1].num} →</a>`:`<a class="btn primary" href="#/desafio">Ir al desafío →</a>`}`};

    $('#score').innerHTML=`<div class="msg ${ok>=6?'good':ok>=4?'warn':'bad'}"><b>${ok} / ${QUIZ.length}</b> — ${ok>=6?'¡Excelente dominio!':ok>=4?'Buen avance; repasa la teoría de los módulos donde fallaste.':'Repasa los módulos 0 a 5 y vuelve a intentarlo.'}</div>${nachito(ok>=6?'¡Bravo! Eres un búho de los modelos lineales. 🦉':ok>=4?'¡Vas muy bien! Un repaso rápido y lo dominas.':'¡Ánimo! Cada intento es una iteración del descenso de gradiente: sigue bajando el error.')}`};

function pageAcerca(){
  view.innerHTML=`<h1>Acerca de</h1><div class="card"><img class="about-img" src="assets/nachito.jpeg" alt="Nachito, mascota de la Universidad Nacional de Colombia"><h3>NeuroLin · Simulador de neuronas</h3><p>Proyecto desarrollado por <b>Jeferson Beltran</b>, estudiante de <b>Economía</b>, para la asignatura <b>Modelos Lineales (2018622)</b>, grupo 1, semestre 2026-II, Departamento de Estadística, Facultad de Ciencias, Universidad Nacional de Colombia (sede Bogotá).</p><p>El simulador replica el comportamiento de una neurona artificial para <b>predecir</b>, <b>decidir</b> y <b>aprender</b>, conectándola con los temas del programa: Cap. 1 (predicción), Cap. 2 (modelo lineal), Cap. 4 (validación, Ridge y LASSO), Cap. 7 (regresión logística) y Cap. 8.4 (redes neuronales).</p><p><b>Nachito</b>, la mascota de la Universidad Nacional de Colombia, acompaña al estudiante en los módulos, el tutorial y el desafío.</p></div>

$('#modal-close').onclick=closeModal;
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();endTutorial()}});
const TUT=[
 {sel:'#panel-ctrl',t:'1 · Controles',d:'Aquí cambias los datos y los parámetros de la neurona. Cada slider tiene también una caja numérica para valores exactos. Los botones ejecutan acciones como entrenar o reiniciar.'},
 {sel:'#figs',t:'2 · Gráficas',d:'Se actualizan en tiempo real. Puedes hacer zoom, mover y pasar el cursor sobre los puntos para ver valores.'},
 {sel:'.fighead .btn',t:'2b · Interpretación',d:'Cada figura tiene un botón ⓘ con su interpretación académica: qué representa, cómo leerla y qué significa estadísticamente.'},
 {sel:'#panel-res',t:'3 · Resultados',d:'Indicadores numéricos y un mensaje de interpretación: te dice si lo que ves es buen ajuste, sobreajuste, divergencia, etc.'},
 {sel:'#btn-teoria',t:'4 · Teoría',d:'Abre la ficha con las fórmulas y la conexión con los capítulos del programa de Modelos Lineales.'}
];
function endTutorial(){$$('.tut-hl').forEach(e=>e.classList.remove('tut-hl'));const c=$('.tut-card');if(c)c.remove()}
function startTutorial(i){
  endTutorial();if(i>=TUT.length)return;const s=TUT[i],el=$(s.sel);if(!el)return;
  el.classList.add('tut-hl');el.scrollIntoView({block:'center',behavior:'smooth'});
  const c=document.createElement('div');c.className='tut-card';
  c.innerHTML=`<div class="who"><span class="av sm"><img src="assets/nachito.jpeg" alt="Nachito"></span><b>Nachito · ${s.t}</b></div><p>${s.d}</p><div style="display:flex;gap:8px;justify-content:space-between"><button class="btn sm" id="tc-x">Salir</button><span>${i>0?'<button class="btn sm" id="tc-p">← Atrás</button> ':''}<button class="btn sm primary" id="tc-n">${i<TUT.length-1?'Siguiente →':'Terminar'}</button></span></div>`;
  document.body.appendChild(c);
  $('#tc-x').onclick=endTutorial;$('#tc-n').onclick=()=>startTutorial(i+1);const p=$('#tc-p');if(p)p.onclick=()=>startTutorial(i-1);
}

/* ============ router y tema ============ */
function route(){
  if(CUR&&CUR.m.leave)CUR.m.leave(CUR.S);CUR=null;closeModal();endTutorial();
  const seg=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean),path=seg.join('/');
  nav(path);$('#side').classList.remove('open');
  if(!seg.length)pageHome();
  else if(path==='modulos')pageModulos();
  else if(seg[0]==='m'&&MODS.find(m=>m.id===seg[1]))pageSim(MODS.find(m=>m.id===seg[1]));
  else if(path==='desafio')pageDesafio();
  else if(path==='acerca')pageAcerca();
  else page404();
  window.scrollTo(0,0);
}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('neurolin-theme',t)}catch(e){}}
(function(){let t=null;try{t=localStorage.getItem('neurolin-theme')}catch(e){}if(!t)t='light';document.documentElement.dataset.theme=t})();
$('#btn-theme').onclick=()=>{setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');if(CUR){const keep=CUR;const l=location.hash;route()}};
$('#burger').onclick=()=>$('#side').classList.toggle('open');
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
